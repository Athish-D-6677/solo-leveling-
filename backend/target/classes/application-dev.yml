spring:
  datasource:
    url: jdbc:mysql://localhost:3306/thesystem_dev?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:thesystem}
    password: ${DB_PASSWORD:thesystem}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

logging:
  level:
    com.thesystem: DEBUG
    org.hibernate.SQL: DEBUG
